name: Tizen Plus
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["tizen/**", "web/**", "webos/**", "tools/**", "i18n/**", "translations/**", ".github/workflows/tizen-plus.yml"]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths: ["tizen/**", "web/**", "webos/**", "tools/**", "i18n/**", "translations/**", ".github/workflows/tizen-plus.yml"]
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  plus:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: python3 tizen/build.py --plus --generic --preview
      - run: python3 tizen/plus/test_build.py
      - run: node tizen/plus/test_suite.mjs
      - run: node tizen/plus/test_autostart.mjs
      - run: node tizen/plus/test_kinopoisk.mjs
      - run: node tizen/plus/test_catalogs.mjs
      - run: node tizen/plus/test_home_catalogs.mjs
      - run: npm ci --prefix tizen/plus
      - run: npx --prefix tizen/plus playwright install --with-deps chromium
      - run: npm test --prefix tizen/plus
