# Full app checks for relevant main changes, ready pull requests, version tags and manual pre-publication runs.
name: Check

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "*.md"
      - "docs/**/*.md"
      - ".github/*.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE/**"
      - ".work.bvc"
      - ".work.bvc/**"
      - ".workgraph/**"
      - "docs/**"
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "*.md"
      - "docs/**/*.md"
      - ".github/*.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE/**"
      - ".work.bvc"
      - ".work.bvc/**"
      - ".workgraph/**"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR cancels the run for the push before it (on main, every merge keeps its own run).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  android:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: Google TV app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The JDK and SDK the README asks for, not whatever the runner image has (build.sh takes the newest it finds,
      # so a newer android.jar would let through a call that breaks everyone's build).
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK (build-tools 34, android-34)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$RUNNER_TEMP/sdk" \
            "build-tools;34.0.0" "platforms;android-34" > /dev/null
          echo "ANDROID_HOME=$RUNNER_TEMP/sdk" >> "$GITHUB_ENV"
      # build.sh makes a throwaway config.properties and signing key: no secrets needed.
      - run: tools/check.sh android

  web:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: Translations, LG and Samsung
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: tools/check.sh web
